name: Test Java

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download test libraries
        run: |
          mkdir -p lib
          curl -sSL -o lib/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o lib/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar

      - name: Compile
        run: |
          mkdir -p build/classes build/test
          javac -d build/classes $(find src -name "*.java")
          javac -cp "build/classes:lib/*" -d build/test $(find test -name "*.java")

      - name: Run unit tests
        run: |
          TESTS=$(find test -name "*Test.java" | sed 's|^test/||; s|\.java$||; s|/|.|g')
          echo "Running: $TESTS"
          java -cp "build/classes:build/test:lib/*" org.junit.runner.JUnitCore $TESTS
